buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '6+'
}

apply plugin: 'org.spongepowered.mixin'

group = 'com.aqu'
version = '1.1.0'

java {
    archivesBaseName = 'Mount-Visibility-Compatibility-1.20.1'
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                mountvisibility {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "mountvisibility.refmap.json"
    config "mountvisibility.mixins.json"
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.17'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
                "Specification-Title": "mountvisibility",
                "Specification-Vendor": "Aqu / Luis",
                "Specification-Version": "1",
                "Implementation-Title": "Mount Visibility Compatibility",
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": "Aqu / Luis"
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
