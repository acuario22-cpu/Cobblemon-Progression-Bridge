name: Build Village PokeCenter Guarantee
on:
  push:
    branches: [ "main", "village-pokecenter-guarantee" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"
      - name: Build
        run: gradle build --stacktrace
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Village-PokeCenter-Guarantee-1.20.1
          path: build/libs/Village-PokeCenter-Guarantee-1.20.1-1.0.0.jar
          if-no-files-found: error
