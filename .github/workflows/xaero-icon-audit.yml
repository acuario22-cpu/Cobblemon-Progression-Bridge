name: Xaero Icon Audit

on:
  push:
    branches:
      - xaero-icon-repair
    paths:
      - ".github/workflows/xaero-icon-audit.yml"
      - "tools/diagnose_xaero_icons.py"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader
        run: python -m pip install --upgrade gdown

      - name: Download current resource packs from Drive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p input out
          gdown 1KHVCaXoSVa4IQVfXN53YlU1gQI1tVhwS -O "input/Generation 1.zip"
          gdown 1-szEd1aXdiJ48OYQzGGd8tcmfPsYUVml -O "input/Generation 2.zip"
          gdown 1_vXpsPEuwcgavodHsacENG2_304PqAgY -O "input/Generation 3.zip"
          gdown 1zWBlHGEfZX7Sgth925e3FaGQ6zXn1euy -O "input/Generation 4.zip"
          gdown 1gNUCM7_zlQC3Zxl-Wlqi25sBg80MySJA -O "input/Generation 5.zip"
          gdown 1UW1UeZoxXuTK4wOPLfnZFYPFSxrJCNkU -O "input/Generation 6.zip"
          gdown 17L0J4u5-oN8zFxHFoJGPB0WU3E6zwkDW -O "input/Generation 7.zip"
          gdown 1FwQmND9GR05ceARqIttvy-BvBRQmZL9w -O "input/Generation 8.zip"
          gdown 1Q5Filuxo_UTmizEa1yZEEnIMhPwQOzy8 -O "input/Generation 9.zip"
          gdown 1jtJwfz8Bs4MUn0P8jW6Gvm3VueCtyQXK -O "input/Pokemon-Minimap-Icons-HD-Complete.zip"
          ls -lh input

      - name: Audit
        run: python tools/diagnose_xaero_icons.py --input input --output out

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: xaero-icon-audit
          path: out/
          if-no-files-found: error
          retention-days: 7
