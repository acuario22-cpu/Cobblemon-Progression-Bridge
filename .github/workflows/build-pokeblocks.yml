name: Build Pokeblocks Forge 1.20.1
on:
  push:
    branches: [ "pokeblocks-forge-1.20.1" ]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"

      - name: Import Pokeblocks 1.4.0 assets and generate Forge registrations
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="pokeblocks-backport/project"
          TMP="$(mktemp -d)"
          ORIGINAL="$TMP/pokeblocks-original.jar"

          curl -fsSL "https://cdn.modrinth.com/data/hnOfcjSq/versions/vhNuAj5l/pokeblocks-1.4.0-1.20.1.jar" -o "$ORIGINAL"
          mkdir -p "$TMP/original"
          (cd "$TMP/original" && jar xf "$ORIGINAL")

          rm -rf "$PROJECT/src/main/resources/assets/pokeblocks" "$PROJECT/src/main/resources/data/pokeblocks"
          mkdir -p "$PROJECT/src/main/resources/assets" "$PROJECT/src/main/resources/data/pokeblocks/loot_tables/blocks" "$PROJECT/src/main/resources/data/pokeblocks/recipes"

          cp -a "$TMP/original/assets/pokeblocks" "$PROJECT/src/main/resources/assets/"
          cp "$TMP/original/LICENSE_pokeblocks" "$PROJECT/LICENSE_ORIGINAL.txt"

          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          project = pathlib.Path("pokeblocks-backport/project")
          original = pathlib.Path("$TMP/original")
          assets = original / "assets/pokeblocks"
          data = original / "data/pokeblocks"
          blockstates = assets / "blockstates"
          block_models = assets / "models/block"
          geos = {
              p.name[:-len(".geo.json")]
              for p in (assets / "geo").glob("*.geo.json")
          }

          ids = []
          for path in blockstates.glob("*.json"):
              name = path.stem
              if (
                  name.startswith("pokedoll_")
                  or name.startswith("gigantic_pokedoll_")
                  or name in {
                      "eiscue_head_pile",
                      "shiny_eiscue_head_pile",
                      "gigantic_eiscue_head_pile",
                      "gigantic_shiny_eiscue_head_pile",
                  }
              ):
                  ids.append(name)

          ids = sorted(set(ids))

          def geo_for(name):
              candidates = [name]

              if name in {
                  "eiscue_head_pile",
                  "shiny_eiscue_head_pile",
                  "gigantic_eiscue_head_pile",
                  "gigantic_shiny_eiscue_head_pile",
              }:
                  candidates.append("eiscue_head_pile_1")

              base = name
              if base.startswith("gigantic_"):
                  base = base[len("gigantic_"):]

              if base.startswith("pokedoll_shiny_"):
                  base = "pokedoll_" + base[len("pokedoll_shiny_"):]
              elif base.startswith("shiny_"):
                  base = base[len("shiny_"):]

              candidates.append(base)
              candidates.append(base.replace("pokedoll_netherite_gholdengo", "pokedoll_gholdengo"))

              if "snorunt_family" in base:
                  candidates.append("pokedoll_snorunt_family_animated")

              for candidate in list(candidates):
                  if candidate.endswith("_posed"):
                      candidates.append(candidate[:-len("_posed")])
                  if candidate.endswith("_noice"):
                      candidates.append(candidate[:-len("_noice")])

              for candidate in candidates:
                  if candidate in geos:
                      return candidate

              species = base.replace("pokedoll_", "")
              fuzzy = sorted(
                  geo for geo in geos
                  if species in geo and not geo.endswith("_animated")
              )
              if fuzzy:
                  return fuzzy[0]

              raise RuntimeError(f"No geo model found for {name}")

          defs = []
          for name in ids:
              model_path = block_models / f"{name}.json"
              model = json.loads(model_path.read_text())
              particle = model.get("textures", {}).get("particle", "")
              prefix = "pokeblocks:block/"
              if not particle.startswith(prefix):
                  raise RuntimeError(f"No particle texture for {name}: {particle}")

              texture = particle[len(prefix):]
              geo = geo_for(name)
              defs.append((name, geo, texture, name.startswith("gigantic_")))

              loot = data / "loot_tables/blocks" / f"{name}.json"
              if loot.exists():
                  shutil.copy2(
                      loot,
                      project / "src/main/resources/data/pokeblocks/loot_tables/blocks" / loot.name
                  )

              recipe = data / "recipes" / f"{name}.json"
              if recipe.exists():
                  shutil.copy2(
                      recipe,
                      project / "src/main/resources/data/pokeblocks/recipes" / recipe.name
                  )

          if len(defs) < 290:
              raise RuntimeError(f"Expected the PokéDoll set, found only {len(defs)} definitions")

          java = project / "src/main/java/dev/mrshawn/pokeblocks/GeneratedDolls.java"
          rows = ",\n        ".join(
              f'new Def("{name}", "{geo}", "{texture}", {str(gigantic).lower()})'
              for name, geo, texture, gigantic in defs
          )
          java.write_text(f"""package dev.mrshawn.pokeblocks;

          import java.util.List;
          import java.util.Map;
          import java.util.function.Function;
          import java.util.stream.Collectors;

          public final class GeneratedDolls {{
              public record Def(String id, String geo, String texture, boolean gigantic) {{}}

              public static final List<Def> ALL = List.of(
                  {rows}
              );

              public static final Map<String, Def> BY_ID = ALL.stream()
                  .collect(Collectors.toUnmodifiableMap(Def::id, Function.identity()));

              private GeneratedDolls() {{}}
          }}
          """.replace("          ", ""))

          print(f"Generated {len(defs)} Forge PokéDoll registrations")
          PY

      - name: Build
        working-directory: pokeblocks-backport/project
        run: gradle build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pokeblocks-Forge-1.20.1-1.4.0-backport
          path: pokeblocks-backport/project/build/libs/Pokeblocks-Forge-1.20.1-1.4.0-forge-backport.1.jar
          if-no-files-found: error
