name: Build CobblemonRider HD Optimized
on:
  push:
    branches: [ "cobblemonrider-hd-optimized-v3" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch workspace
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"

      - name: Clone upstream CobblemonRider 1.20.1 Forge source
        run: git clone --depth 1 --branch Forge_1.5 https://github.com/Zanckor/CobblemonRider.git rider-src

      - name: Apply V6 movement/safety patch
        run: |
          cp rider-patches/ConfigPacket.java rider-src/src/main/java/dev/zanckor/cobblemonrider/network/packet/ConfigPacket.java
          cp rider-patches/NetworkHandler.java rider-src/src/main/java/dev/zanckor/cobblemonrider/network/NetworkHandler.java
          cp rider-patches/ClientHandler.java rider-src/src/main/java/dev/zanckor/cobblemonrider/network/ClientHandler.java
          cp rider-patches/MCUtil.java rider-src/src/main/java/dev/zanckor/cobblemonrider/MCUtil.java
          cp rider-patches/FormRideCompat.java rider-src/src/main/java/dev/zanckor/cobblemonrider/FormRideCompat.java\n          cp rider-patches/MountSafety.java rider-src/src/main/java/dev/zanckor/cobblemonrider/MountSafety.java\n          cp rider-patches/PlayerMixin.java rider-src/src/main/java/dev/zanckor/cobblemonrider/mixin/PlayerMixin.java\n          cp rider-patches/ServerPlayerEvent.java rider-src/src/main/java/dev/zanckor/cobblemonrider/event/ServerPlayerEvent.java
          python rider-patches/patch_source.py rider-src

      - name: Build replacement JAR
        working-directory: rider-src
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify built JAR
        working-directory: rider-src
        run: |
          JAR="$(find build/libs -maxdepth 1 -name 'cobblemonrider-1.2.4-HD-Optimized-V6.jar' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'dev/zanckor/cobblemonrider/FormRideCompat.class'
          ! javap -classpath "$JAR" -c -p dev.zanckor.cobblemonrider.network.packet.ConfigPacket | grep -q 'writeUtf'
          javap -classpath "$JAR" -c -p dev.zanckor.cobblemonrider.mixin.PokemonMixin | grep -q 'FormRideCompat.resolve'
          javap -classpath "$JAR" -c -p dev.zanckor.cobblemonrider.mixin.PokemonMixin | grep -q 'cachedConfigSource'
          echo "Built: $JAR"
          sha256sum "$JAR"

      - name: Upload optimized replacement
        uses: actions/upload-artifact@v4
        with:
          name: cobblemonrider-1.2.4-HD-Optimized-V6
          path: rider-src/build/libs/cobblemonrider-1.2.4-HD-Optimized-V5.jar
          if-no-files-found: error
