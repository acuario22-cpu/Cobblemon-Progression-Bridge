name: Build CobbledGacha Forge 1.20.1
on:
  push:
    branches: [ "cobbledgacha-forge-1.20.1" ]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"

      - name: Import original 3.0.3 assets and migrate to 1.20.1
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT="cobbledgacha-backport/project"
          TMP="$(mktemp -d)"

          curl -fsSL "https://api.modrinth.com/v2/version/S1kcfrxR" -o "$TMP/version.json"
          URL="$(jq -r '.files[] | select(.primary == true) | .url' "$TMP/version.json" | head -n1)"
          [ -n "$URL" ] && [ "$URL" != "null" ] || URL="$(jq -r '.files[0].url' "$TMP/version.json")"
          curl -fsSL "$URL" -o "$TMP/original.jar"

          mkdir -p "$TMP/original"
          (cd "$TMP/original" && jar xf "$TMP/original.jar")

          rm -rf "$PROJECT/src/main/resources/assets/cobbledgacha" "$PROJECT/src/main/resources/data/cobbledgacha"
          mkdir -p "$PROJECT/src/main/resources/assets" "$PROJECT/src/main/resources/data/cobbledgacha/tags"

          cp -a "$TMP/original/assets/cobbledgacha" "$PROJECT/src/main/resources/assets/"
          cp -a "$TMP/original/data/cobbledgacha/config" "$PROJECT/src/main/resources/data/cobbledgacha/"
          cp -a "$TMP/original/data/cobbledgacha/spawn_pool_files" "$PROJECT/src/main/resources/data/cobbledgacha/"
          cp -a "$TMP/original/data/cobbledgacha/loot_table" "$PROJECT/src/main/resources/data/cobbledgacha/loot_tables"
          cp -a "$TMP/original/data/cobbledgacha/recipe" "$PROJECT/src/main/resources/data/cobbledgacha/recipes"
          cp -a "$TMP/original/data/cobbledgacha/tags/item" "$PROJECT/src/main/resources/data/cobbledgacha/tags/items"

          python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path("cobbledgacha-backport/project")
          recipes = root / "src/main/resources/data/cobbledgacha/recipes"
          loot_tables = root / "src/main/resources/data/cobbledgacha/loot_tables"
          tags = root / "src/main/resources/data/cobbledgacha/tags/items"
          assets = root / "src/main/resources/assets/cobbledgacha"

          # Minecraft 1.21.1 recipe result "id" -> 1.20.1 "item".
          for path in recipes.rglob("*.json"):
              try:
                  data = json.loads(path.read_text())
                  result = data.get("result")
                  if isinstance(result, dict) and "id" in result and "item" not in result:
                      result["item"] = result.pop("id")
                  path.write_text(json.dumps(data, indent=2) + "\n")
              except Exception:
                  pass

          # Replace custom 1.21 loot contexts with a valid 1.20.1 context.
          for path in loot_tables.rglob("*.json"):
              try:
                  data = json.loads(path.read_text())
                  if isinstance(data, dict) and str(data.get("type", "")).startswith("cobbledgacha:"):
                      data["type"] = "minecraft:generic"
                  path.write_text(json.dumps(data, indent=2) + "\n")
              except Exception:
                  pass

          # The seven coloured Poké Gacha machines share the same reward table.
          # Give the ten coloured Gacha Coins an actual purpose: any colour works in any Poké Gacha colour.
          all_gacha_coins = ["cobbledgacha:gacha_coin"] + [
              f"cobbledgacha:gacha_coin_{i}" for i in range(2, 11)
          ]
          for machine_id in (1, 5, 6, 7, 8, 9, 10):
              filename = "currency_items.json" if machine_id == 1 else f"currency_items_{machine_id}.json"
              (tags / filename).write_text(
                  json.dumps({"values": all_gacha_coins}, indent=2) + "\n"
              )

          # Add survival acquisition for the six Gacha Balls.
          # Each ball uses a normal Poké Ball plus its matching coloured Gacha Coin.
          for i in range(1, 7):
              coin = "cobbledgacha:gacha_coin" if i == 1 else f"cobbledgacha:gacha_coin_{i}"
              data = {
                  "type": "minecraft:crafting_shapeless",
                  "category": "misc",
                  "ingredients": [
                      {"item": "cobblemon:poke_ball"},
                      {"item": coin}
                  ],
                  "result": {
                      "item": f"cobbledgacha:gacha_ball_{i}",
                      "count": 1
                  }
              }
              (recipes / f"gacha_ball_{i}.json").write_text(
                  json.dumps(data, indent=2) + "\n"
              )

          # Koban Coin now has a real survival recipe.
          koban = {
              "type": "minecraft:crafting_shapeless",
              "category": "misc",
              "ingredients": [
                  {"item": "cobblemon:relic_coin"},
                  {"item": "minecraft:gold_ingot"},
                  {"item": "minecraft:gold_ingot"},
                  {"item": "minecraft:gold_ingot"},
                  {"item": "minecraft:gold_ingot"},
                  {"item": "minecraft:redstone"}
              ],
              "result": {
                  "item": "cobbledgacha:koban_coin",
                  "count": 1
              }
          }
          (recipes / "koban_coin.json").write_text(
              json.dumps(koban, indent=2) + "\n"
          )

          # Keep the original builtin/entity item models.
          # Forge 1.20.1 renders them through GeoMachineBlockItem + MachineItemRenderer.

          # Build a compact client-side index of every Pokémon pool used by JEI.
          pools_root = root / "src/main/resources/data/cobbledgacha/spawn_pool_files"
          spawn_index = []
          for path in pools_root.rglob("*.json"):
              relative = path.relative_to(pools_root)
              if not relative.parts:
                  continue
              pool = relative.parts[0]

              try:
                  data = json.loads(path.read_text())
                  for spawn in data.get("spawns", []):
                      if not isinstance(spawn, dict):
                          continue
                      spawn_index.append({
                          "pool": pool,
                          "species": spawn.get("species", ""),
                          "bucket": spawn.get("bucket", "common"),
                          "weight": spawn.get("weight", 1.0),
                          "minLevel": spawn.get("minLevel", 1),
                          "maxLevel": spawn.get("maxLevel", spawn.get("minLevel", 1))
                      })
              except Exception:
                  pass

          jei_dir = assets / "jei"
          jei_dir.mkdir(parents=True, exist_ok=True)
          (jei_dir / "spawn_index.json").write_text(
              json.dumps(spawn_index, ensure_ascii=False, separators=(",", ":")) + "\n"
          )

          # JEI labels + gameplay feedback.
          lang_dir = assets / "lang"
          translations = {
              "en_us.json": {
                  "jei.cobbledgacha.machine_rewards": "Cobbled Gacha Rewards",
                  "jei.cobbledgacha.capsule_rewards": "Capsule Contents",
                  "jei.cobbledgacha.pokemon_rewards": "Pokémon Gacha Rewards",
                  "jei.cobbledgacha.ball_pokemon": "Gacha Ball Pokémon",
                  "jei.cobbledgacha.plush_o_matic": "Plush-O-Matic",
                  "jei.cobbledgacha.plush_variant": "Variant: %s",
                  "jei.cobbledgacha.variant.normal": "Normal",
                  "jei.cobbledgacha.variant.shiny": "Shiny",
                  "jei.cobbledgacha.variant.gigantic": "Gigantic",
                  "jei.cobbledgacha.variant.gigantic_shiny": "Gigantic Shiny",
                  "jei.cobbledgacha.use_ball": "Use the ball to receive one Pokémon",
                  "jei.cobbledgacha.pokemon_headers": "Pokémon                  Rarity       Lv.       Chance",
                  "message.cobbledgacha.invalid_currency_detail": "This machine needs: %s",
                  "message.cobbledgacha.same_yarn_required": "Keep using the same Yarn until 3/3.",
                  "message.cobbledgacha.currency.gacha_coin": "any Gacha Coin colour",
                  "message.cobbledgacha.currency.apricorn": "any Apricorn",
                  "message.cobbledgacha.currency.relic_coin": "Relic Coin",
                  "message.cobbledgacha.currency.diamond": "Diamond",
                  "message.cobbledgacha.currency.koban_coin": "Koban Coin",
                  "message.cobbledgacha.currency.yarn": "3 of the same Yarn",
                  "message.cobbledgacha.currency.valid": "a valid currency",
                  "message.cobbledgacha.obtained_item": "Obtained: %sx %s",
                  "message.cobbledgacha.spawned_pokemon": "Appeared: %s Lv.%s",
                  "message.cobbledgacha.received_pokemon": "Received Pokémon: %s Lv.%s",
                  "message.cobbledgacha.reward_failed": "The machine could not generate a reward.",
                  "message.cobbledgacha.pokemon_failed": "No Pokémon could be generated."
              },
              "es_es.json": {
                  "jei.cobbledgacha.machine_rewards": "Premios de Cobbled Gacha",
                  "jei.cobbledgacha.capsule_rewards": "Contenido de Cápsulas",
                  "jei.cobbledgacha.pokemon_rewards": "Premios Pokémon de Gacha",
                  "jei.cobbledgacha.ball_pokemon": "Pokémon de Gacha Balls",
                  "jei.cobbledgacha.plush_o_matic": "Plush-O-Matic",
                  "jei.cobbledgacha.plush_variant": "Variante: %s",
                  "jei.cobbledgacha.variant.normal": "Normal",
                  "jei.cobbledgacha.variant.shiny": "Shiny",
                  "jei.cobbledgacha.variant.gigantic": "Gigantic",
                  "jei.cobbledgacha.variant.gigantic_shiny": "Gigantic Shiny",
                  "jei.cobbledgacha.use_ball": "Usa la bola para recibir un Pokémon",
                  "jei.cobbledgacha.pokemon_headers": "Pokémon                  Rareza       Nv.       Prob.",
                  "message.cobbledgacha.invalid_currency_detail": "Esta máquina necesita: %s",
                  "message.cobbledgacha.same_yarn_required": "Debes seguir usando el mismo Yarn hasta 3/3.",
                  "message.cobbledgacha.currency.gacha_coin": "cualquier Moneda Gacha",
                  "message.cobbledgacha.currency.apricorn": "cualquier Apricorn",
                  "message.cobbledgacha.currency.relic_coin": "Relic Coin",
                  "message.cobbledgacha.currency.diamond": "Diamante",
                  "message.cobbledgacha.currency.koban_coin": "Koban Coin",
                  "message.cobbledgacha.currency.yarn": "3 unidades del mismo Yarn",
                  "message.cobbledgacha.currency.valid": "una moneda o material válido",
                  "message.cobbledgacha.obtained_item": "Obtuviste: %sx %s",
                  "message.cobbledgacha.spawned_pokemon": "Apareció: %s Nv.%s",
                  "message.cobbledgacha.received_pokemon": "Recibiste Pokémon: %s Nv.%s",
                  "message.cobbledgacha.reward_failed": "La máquina no pudo generar una recompensa.",
                  "message.cobbledgacha.pokemon_failed": "No se pudo generar ningún Pokémon."
              }
          }

          for lang_name, labels in translations.items():
              path = lang_dir / lang_name
              if path.exists():
                  data = json.loads(path.read_text())
              else:
                  data = {}
              data.update(labels)
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n"
              )
          PY

          cp "$TMP/original/LICENSE_Cobbled Gacha" "$PROJECT/LICENSE_ORIGINAL.txt" || true

      - name: Build
        working-directory: cobbledgacha-backport/project
        run: gradle build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CobbledGacha-Forge-1.20.1-3.0.3-backport
          path: cobbledgacha-backport/project/build/libs/CobbledGacha-Forge-1.20.1-3.0.3-backport.4.jar
          if-no-files-found: error
