name: Build CobbledGacha Forge 1.20.1
on:
  push:
    branches: [ "cobbledgacha-forge-1.20.1" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"
      - name: Import original 3.0.3 assets and migrate to 1.20.1
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT="cobbledgacha-backport/project"
          TMP="$(mktemp -d)"
          curl -fsSL "https://api.modrinth.com/v2/version/S1kcfrxR" -o "$TMP/version.json"
          URL="$(jq -r '.files[] | select(.primary == true) | .url' "$TMP/version.json" | head -n1)"
          [ -n "$URL" ] && [ "$URL" != "null" ] || URL="$(jq -r '.files[0].url' "$TMP/version.json")"
          curl -fsSL "$URL" -o "$TMP/original.jar"
          mkdir -p "$TMP/original"
          (cd "$TMP/original" && jar xf "$TMP/original.jar")
          rm -rf "$PROJECT/src/main/resources/assets/cobbledgacha" "$PROJECT/src/main/resources/data/cobbledgacha"
          mkdir -p "$PROJECT/src/main/resources/assets" "$PROJECT/src/main/resources/data/cobbledgacha/tags"
          cp -a "$TMP/original/assets/cobbledgacha" "$PROJECT/src/main/resources/assets/"
          cp -a "$TMP/original/data/cobbledgacha/config" "$PROJECT/src/main/resources/data/cobbledgacha/"
          cp -a "$TMP/original/data/cobbledgacha/spawn_pool_files" "$PROJECT/src/main/resources/data/cobbledgacha/"
          cp -a "$TMP/original/data/cobbledgacha/loot_table" "$PROJECT/src/main/resources/data/cobbledgacha/loot_tables"
          cp -a "$TMP/original/data/cobbledgacha/recipe" "$PROJECT/src/main/resources/data/cobbledgacha/recipes"
          cp -a "$TMP/original/data/cobbledgacha/tags/item" "$PROJECT/src/main/resources/data/cobbledgacha/tags/items"
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("cobbledgacha-backport/project")
          for p in (root/"src/main/resources/data/cobbledgacha/recipes").rglob("*.json"):
              try:
                  d=json.loads(p.read_text()); r=d.get("result")
                  if isinstance(r,dict) and "id" in r and "item" not in r:r["item"]=r.pop("id")
                  p.write_text(json.dumps(d,indent=2)+"\n")
              except Exception:pass
          for p in (root/"src/main/resources/data/cobbledgacha/loot_tables").rglob("*.json"):
              try:
                  d=json.loads(p.read_text())
                  if isinstance(d,dict) and str(d.get("type","")).startswith("cobbledgacha:"):d["type"]="minecraft:generic"
                  p.write_text(json.dumps(d,indent=2)+"\n")
              except Exception:pass
          item_models=root/"src/main/resources/assets/cobbledgacha/models/item"
          for n in range(1,13):
              name="gacha_machine" if n==1 else f"gacha_machine_{n}"
              (item_models/f"{name}.json").write_text(json.dumps({"parent":"minecraft:item/generated","textures":{"layer0":f"cobbledgacha:item/{name}"}},indent=2)+"\n")

          # Build a compact client-side index of the default Pokémon pools so JEI can display them.
          pools_root=root/"src/main/resources/data/cobbledgacha/spawn_pool_files"
          spawn_index=[]
          for p in pools_root.rglob("*.json"):
              rel=p.relative_to(pools_root)
              if not rel.parts: continue
              pool=rel.parts[0]
              try:
                  d=json.loads(p.read_text())
                  for s in d.get("spawns",[]):
                      if not isinstance(s,dict): continue
                      spawn_index.append({
                          "pool":pool,
                          "species":s.get("species",""),
                          "bucket":s.get("bucket","common"),
                          "weight":s.get("weight",1.0),
                          "minLevel":s.get("minLevel",1),
                          "maxLevel":s.get("maxLevel",s.get("minLevel",1))
                      })
              except Exception:
                  pass
          jei_dir=root/"src/main/resources/assets/cobbledgacha/jei"
          jei_dir.mkdir(parents=True,exist_ok=True)
          (jei_dir/"spawn_index.json").write_text(json.dumps(spawn_index,ensure_ascii=False,separators=(",",":"))+"\n")

          # Add JEI labels to the original language files.
          lang_dir=root/"src/main/resources/assets/cobbledgacha/lang"
          for lang_name, labels in {
              "en_us.json":{
                  "jei.cobbledgacha.machine_rewards":"Cobbled Gacha Rewards",
                  "jei.cobbledgacha.capsule_rewards":"Capsule Contents",
                  "jei.cobbledgacha.pokemon_rewards":"Pokémon Gacha Rewards"
              },
              "es_es.json":{
                  "jei.cobbledgacha.machine_rewards":"Premios de Cobbled Gacha",
                  "jei.cobbledgacha.capsule_rewards":"Contenido de Cápsulas",
                  "jei.cobbledgacha.pokemon_rewards":"Premios Pokémon de Gacha"
              }
          }.items():
              path=lang_dir/lang_name
              if path.exists():
                  data=json.loads(path.read_text())
                  data.update(labels)
                  path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          PY
          cp "$TMP/original/LICENSE_Cobbled Gacha" "$PROJECT/LICENSE_ORIGINAL.txt" || true
      - name: Build
        working-directory: cobbledgacha-backport/project
        run: gradle build --stacktrace
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CobbledGacha-Forge-1.20.1-3.0.3-backport
          path: cobbledgacha-backport/project/build/libs/CobbledGacha-Forge-1.20.1-3.0.3-backport.1.jar
          if-no-files-found: error
